<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yumix Games</title>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
  rel="stylesheet"
>

<link rel="stylesheet" href="assets/style.css">

<style>
/* ============================================
   RESET & GLOBAL
   ============================================ */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
}

body {
  background: #050505;
  color: #f5f5f5;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  position: relative;
  min-height: 100vh;
}

/* Ambient glow */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(255,255,255,.045) 0%,
      transparent 45%
    ),
    radial-gradient(
      circle at 15% 85%,
      rgba(255,255,255,.025) 0%,
      transparent 40%
    ),
    radial-gradient(
      circle at 85% 15%,
      rgba(255,255,255,.025) 0%,
      transparent 40%
    );
  z-index: 0;
  pointer-events: none;
}

/* Subtle grain */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity: .025;
  z-index: 0;
  pointer-events: none;
}

/* ============================================
   NAVIGATION
   ============================================ */
.top {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 18px 32px;

  background: rgba(5,5,5,.7);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  border-bottom: 1px solid rgba(255,255,255,.06);

  animation: navIn .5s ease both;
}

@keyframes navIn {
  from {
    opacity: 0;
    transform: translateY(-20px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.logo {
  font-size: 18px;
  font-weight: 900;
  letter-spacing: -.04em;
  color: #fff;
  text-decoration: none;
}

.logo b {
  color: #888;
}

.links {
  display: flex;
  gap: 6px;
}

.links a {
  padding: 9px 16px;
  border-radius: 10px;

  color: rgba(255,255,255,.6);
  text-decoration: none;

  font-size: 13px;
  font-weight: 600;

  transition: all .2s ease;
}

.links a:hover {
  color: #fff;
  background: rgba(255,255,255,.06);
}

.links a.on {
  color: #fff;
  background: rgba(255,255,255,.1);
}

/* ============================================
   HERO
   ============================================ */
.hero {
  position: relative;
  z-index: 1;

  text-align: center;

  padding: 130px 20px 40px;

  animation: heroIn .9s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes heroIn {
  from {
    opacity: 0;
    transform: translateY(40px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.hero h1 {
  font-size: clamp(3rem, 11vw, 6.5rem);
  font-weight: 900;
  letter-spacing: -.06em;
  line-height: 1;

  color: #fff;

  text-shadow: 0 0 60px rgba(255,255,255,.08);
}

.hero h1 b {
  background: linear-gradient(180deg,#fff 0%,#666 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.hero p {
  max-width: 560px;

  margin: 18px auto 34px;

  color: rgba(255,255,255,.5);

  font-weight: 500;
  line-height: 1.65;
  font-size: 15px;
}

.cta {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;

  padding: 14px 28px;

  border-radius: 14px;

  font-family: inherit;
  font-size: 14px;
  font-weight: 700;

  text-decoration: none;

  cursor: pointer;

  border: 2px solid transparent;

  transition: all .25s cubic-bezier(.2,.8,.2,1);

  letter-spacing: -.01em;
}

.btn.acc {
  background: transparent;
  color: #fff;
  border-color: rgba(255,255,255,.15);
}

.btn.acc:hover {
  background: rgba(255,255,255,.06);
  border-color: rgba(255,255,255,.3);

  transform: translateY(-3px);
}

/* ============================================
   GAMES SECTION
   ============================================ */
.games-section {
  position: relative;
  z-index: 1;

  max-width: 1300px;

  margin: 40px auto 0;

  padding: 0 28px;

  animation: sectionIn .8s .2s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes sectionIn {
  from {
    opacity: 0;
    transform: translateY(30px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.games-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 20px;

  flex-wrap: wrap;
  gap: 12px;
}

.games-section-head h2 {
  font-size: 1.5rem;
  font-weight: 800;
  letter-spacing: -.03em;
  color: #fff;
}

.gl-meta {
  color: rgba(255,255,255,.4);

  font-size: 13px;
  font-weight: 600;

  margin-bottom: 20px;
}

/* ============================================
   GAME GRID
   ============================================ */
.games-grid {
  display: grid;

  grid-template-columns:
    repeat(auto-fill, minmax(165px, 1fr));

  gap: 20px;

  margin-bottom: 60px;
}

/*
   GAME CARD

   IMPORTANT:
   games.js should generate links like:

   <a href="Games/FlappyBird/index.html" class="gl-card">

   or:

   <a href="games/flappy-bird/index.html" class="gl-card">
*/
.gl-card {
  display: flex;
  flex-direction: column;

  padding: 9px;

  border-radius: 16px;

  background: rgba(255,255,255,.03);

  border: 1.5px solid rgba(255,255,255,.08);

  text-decoration: none;

  color: #fff;

  cursor: pointer;

  transition:
    all .3s cubic-bezier(.2,.8,.2,1);

  position: relative;

  overflow: hidden;

  animation: cardIn .5s ease both;

  animation-delay:
    calc(var(--i,0) * 12ms);
}

@keyframes cardIn {
  from {
    opacity: 0;
    transform: translateY(15px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.gl-card::before {
  content: '';

  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.06),
      transparent 60%
    );

  opacity: 0;

  transition: opacity .3s ease;

  pointer-events: none;
}

.gl-card:hover::before {
  opacity: 1;
}

.gl-card:hover {
  border-color: rgba(255,255,255,.35);

  transform:
    translateY(-8px)
    scale(1.02);

  box-shadow:
    0 24px 50px rgba(0,0,0,.6),
    0 0 30px rgba(255,255,255,.04);
}

.gl-art {
  position: relative;

  display: block;

  aspect-ratio: 1;

  overflow: hidden;

  border-radius: 11px;

  background: #111;

  margin-bottom: 10px;
}

.gl-art img {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  transition:
    transform .5s cubic-bezier(.2,.8,.2,1),
    filter .3s ease;
}

.gl-card:hover .gl-art img {
  transform: scale(1.08);
  filter: brightness(1.1);
}

/* Play label */
.gl-play {
  position: absolute;

  left: 10px;
  right: 10px;
  bottom: 10px;

  display: flex;

  align-items: center;
  justify-content: center;

  height: 34px;

  border-radius: 9px;

  background: rgba(255,255,255,.95);

  color: #000;

  font-weight: 800;
  font-size: 12.5px;

  letter-spacing: .02em;

  opacity: 0;

  transform: translateY(10px);

  transition:
    all .3s cubic-bezier(.2,.8,.2,1);
}

.gl-card:hover .gl-play {
  opacity: 1;
  transform: translateY(0);
}

.gl-card h3 {
  margin: 0 3px 3px;

  font-size: 13.5px;
  font-weight: 700;

  text-align: left;

  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;

  letter-spacing: -.01em;

  color: #fff;
}

/* ============================================
   CREDITS
   ============================================ */
.cred {
  position: relative;
  z-index: 1;

  margin-top: 20px;

  text-align: center;

  padding: 40px 20px 0;
}

.cred h2 {
  font-size: 1.15rem;
  font-weight: 800;

  letter-spacing: -.02em;

  color: #fff;
}

.cred p {
  color: rgba(255,255,255,.4);

  font-size: .9rem;

  margin: 6px 0 24px;
}

.slider {
  overflow: hidden;

  -webkit-mask:
    linear-gradient(
      90deg,
      transparent,
      #000 8%,
      #000 92%,
      transparent
    );

  mask:
    linear-gradient(
      90deg,
      transparent,
      #000 8%,
      #000 92%,
      transparent
    );
}

.track {
  display: flex;

  gap: 18px;

  width: max-content;

  animation: slide 30s linear infinite;
}

.slider:hover .track {
  animation-play-state: paused;
}

@keyframes slide {
  to {
    transform: translateX(-50%);
  }
}

.slide {
  width: 170px;
  flex: none;

  text-align: center;
}

.slide .im {
  width: 170px;
  height: 170px;

  border-radius: 18px;

  background: rgba(255,255,255,.04);

  border: 1.5px solid rgba(255,255,255,.08);

  display: flex;

  align-items: center;
  justify-content: center;

  color: rgba(255,255,255,.3);

  font-weight: 700;
  font-size: 12px;

  padding: 10px;
}

.slide img {
  width: 100%;
  height: 100%;

  object-fit: cover;

  border-radius: 16px;
}

.slide span {
  display: block;

  margin-top: 8px;

  font-size: 13px;
  font-weight: 700;

  color: rgba(255,255,255,.75);
}

/* ============================================
   FOOTER
   ============================================ */
footer {
  position: relative;
  z-index: 1;

  text-align: center;

  color: rgba(255,255,255,.25);

  font-size: .8rem;

  padding: 48px 0 32px;

  font-weight: 600;
}

/* ============================================
   MOBILE
   ============================================ */
@media (max-width: 720px) {

  .top {
    padding: 14px 16px;
  }

  .links a {
    padding: 8px 12px;
    font-size: 12px;
  }

  .logo {
    font-size: 16px;
  }

  .hero {
    padding: 110px 16px 30px;
  }

  .hero p {
    font-size: 14px;
  }

  .btn {
    padding: 12px 22px;
    font-size: 13px;
  }

  .games-section {
    padding: 0 16px;
  }

  .games-grid {
    grid-template-columns: repeat(2,1fr);
    gap: 12px;
  }

  .gl-card {
    padding: 7px;
    border-radius: 13px;
  }

  .gl-card h3 {
    font-size: 12px;
  }

  .gl-play {
    height: 30px;
    font-size: 11px;
  }
}

/* ============================================
   REDUCED MOTION
   ============================================ */
@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    animation-duration: .001ms !important;
    transition-duration: .001ms !important;
  }
}
</style>
</head>

<body>

<!-- ============================================
     NAVIGATION
     ============================================ -->

<nav class="top">

  <a class="logo" href="index.html">
    Yumix<b>.</b>Games
  </a>

  <div class="links">

    <a class="on" href="index.html">
      Home
    </a>

    <a href="sendMSGtoowner.html">
      Message Owner
    </a>

  </div>

</nav>


<!-- ============================================
     HERO
     ============================================ -->

<header class="hero">

  <h1>
    Yumix <b>Games</b>
  </h1>

  <p>
    Jump into a game in one click.
    No downloads, no waiting, just play.
  </p>

  <div class="cta">

    <a
      class="btn acc"
      href="sendMSGtoowner.html"
    >
      Message the Owner
    </a>

  </div>

</header>


<!-- ============================================
     GAMES
     ============================================ -->

<section class="games-section">

  <div class="games-section-head">

    <h2>
      All games
    </h2>

  </div>

  <p
    class="gl-meta"
    id="gl-count"
  ></p>

  <div
    class="games-grid"
    id="gameGallery"
  ></div>

</section>


<!-- ============================================
     CREDITS
     ============================================ -->

<section class="cred">

  <h2>
    Thank you to our helpers
  </h2>

  <p>
    The people who made this site possible.
  </p>

  <div class="slider">

    <div
      class="track"
      id="track"
    ></div>

  </div>

</section>


<!-- ============================================
     FOOTER
     ============================================ -->

<footer>
  Made by the Yumix team
</footer>


<!-- ============================================
     GAMES LOADER
     ============================================ -->

<script src="games.js"></script>


<!-- ============================================
     CREDITS SLIDER
     ============================================ -->

<script>

const SLIDES = [
  // Example:
  // 'helper1.png',
  // { src: 'helper2.png', name: 'Alex' },
];

const items =
  SLIDES.length
    ? SLIDES
    : Array.from({ length: 8 }, () => null);

const html = items
  .map(function (s) {

    if (!s) {

      return `
        <div class="slide">
          <div class="im">
            Add images to assets/slider
          </div>
        </div>
      `;

    }

    const o =
      typeof s === 'string'
        ? {
            src: s,
            name: ''
          }
        : s;

    const el =
      document.createElement('div');

    el.className = 'slide';

    const im =
      document.createElement('div');

    im.className = 'im';

    const img =
      new Image();

    img.src =
      'assets/slider/' + o.src;

    img.alt =
      o.name || '';

    im.appendChild(img);

    el.appendChild(im);

    if (o.name) {

      const sp =
        document.createElement('span');

      sp.textContent =
        o.name;

      el.appendChild(sp);

    }

    return el.outerHTML;

  })
  .join('');

document.getElementById('track').innerHTML =
  html + html;

</script>

</body>
</html>
